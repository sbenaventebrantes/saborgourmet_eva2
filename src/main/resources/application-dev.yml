# Ambiente de DESARROLLO: base de datos H2 en memoria.
# No requiere instalar ningun motor de base de datos: al detener la aplicacion
# los datos se pierden y al iniciarla se vuelven a crear las tablas y los
# registros de ejemplo de la clase DatosIniciales.
spring:
  datasource:
    url: jdbc:h2:mem:saborgourmet
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # create-drop: Hibernate crea el esquema al arrancar y lo elimina al cerrar.
      ddl-auto: create-drop
    # Muestra en la consola el SQL que genera Hibernate; util para aprender y depurar.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    # Sin cache: al guardar un cambio en una plantilla basta recargar el navegador.
    cache: false

  # Consola web de H2 para inspeccionar las tablas en http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
