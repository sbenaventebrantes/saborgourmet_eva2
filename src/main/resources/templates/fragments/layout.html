<!DOCTYPE html>
<!--
  Plantilla base del sitio.

  Este archivo no se muestra por si solo: define fragmentos reutilizables
  (th:fragment) que el resto de las paginas incorpora con th:replace. Gracias a
  esto la cabecera, el menu y el pie se escriben una sola vez, y un cambio de
  estilo se refleja en todas las pantallas.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!--
  Fragmento "cabeza": recibe el titulo de cada pagina como parametro.
  Incluye Bootstrap 5 desde CDN, que aporta la grilla responsiva, y la etiqueta
  viewport, indispensable para que el sitio se adapte a pantallas de telefono.
-->
<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Sabor Gourmet - ' + ${titulo}">Sabor Gourmet</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Hoja de estilos propia, servida desde src/main/resources/static/css -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!--
  Fragmento "menu": barra de navegacion.
  La clase navbar-expand-lg de Bootstrap colapsa el menu en un boton de tres
  lineas cuando la pantalla es angosta, uno de los pilares del diseno responsivo.
-->
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light barra-superior">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Sabor Gourmet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Abrir el menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Reservar</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservas/buscar}">Mi reserva</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Administracion</a></li>
            </ul>
        </div>
    </div>
</nav>

<!--
  Fragmento "avisos": muestra los mensajes de exito o de error.
  th:if hace que cada bloque aparezca solo cuando el controlador dejo el
  atributo correspondiente en el modelo.
-->
<div th:fragment="avisos" class="container mt-3">
    <div th:if="${exito}" class="alert alert-success" role="alert" th:text="${exito}"></div>
    <div th:if="${errorNegocio}" class="alert alert-danger" role="alert" th:text="${errorNegocio}"></div>
</div>

<!-- Fragmento "pie": pie de pagina comun y el JavaScript de Bootstrap. -->
<footer th:fragment="pie">
    <div class="pie-pagina mt-5 py-4">
        <div class="container text-center">
            <p class="mb-1 fw-semibold">Restaurante Sabor Gourmet</p>
            <p class="mb-0 small">Reservas en linea - Av. Las Condes 1234, Santiago - +56 2 2345 6789</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
