<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  Detalle de una reserva. Es la pagina que ve el cliente despues de reservar y
  tambien al consultar su reserva mas tarde. Desde aqui puede modificarla o
  cancelarla.
-->
<head th:replace="~{fragments/layout :: cabeza('Detalle de la reserva')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu}"></nav>
<div th:replace="~{fragments/layout :: avisos}"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card tarjeta-principal">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <h1 class="h4 mb-0">Reserva <span th:text="${reserva.codigo}">SG-000000</span></h1>
                        <!--
                          th:classappend agrega una clase calculada: verde si la
                          reserva esta vigente y gris si fue cancelada.
                        -->
                        <span class="badge"
                              th:classappend="${reserva.estaActiva()} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${reserva.estado.etiqueta}">Confirmada</span>
                    </div>

                    <hr>

                    <!-- dl responsiva: en telefono una columna, en escritorio dos -->
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Cliente</dt>
                        <dd class="col-sm-8" th:text="${reserva.cliente.nombre}">Nombre</dd>

                        <dt class="col-sm-4">Correo</dt>
                        <dd class="col-sm-8" th:text="${reserva.cliente.email}">correo@ejemplo.cl</dd>

                        <dt class="col-sm-4">Telefono</dt>
                        <dd class="col-sm-8" th:text="${reserva.cliente.telefono}">+56 9 0000 0000</dd>

                        <dt class="col-sm-4">Fecha</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(reserva.fecha, 'dd-MM-yyyy')}">23-11-2026</dd>

                        <dt class="col-sm-4">Horario</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(reserva.hora, 'HH:mm')} + ' horas'">20:00 horas</dd>

                        <dt class="col-sm-4">Mesa</dt>
                        <dd class="col-sm-8" th:text="${reserva.mesa.descripcion}">Mesa 3 (Salon principal)</dd>

                        <dt class="col-sm-4">Personas</dt>
                        <dd class="col-sm-8" th:text="${reserva.cantidadPersonas}">4</dd>

                        <!-- Las observaciones se muestran solo si el cliente escribio algo -->
                        <th:block th:if="${reserva.observaciones != null and !reserva.observaciones.isBlank()}">
                            <dt class="col-sm-4">Observaciones</dt>
                            <dd class="col-sm-8" th:text="${reserva.observaciones}">Sin observaciones</dd>
                        </th:block>
                    </dl>

                </div>
            </div>

            <!--
              Los botones de accion aparecen solo si la reserva sigue vigente y
              todavia no ocurrio. Asi no se ofrece modificar algo que ya paso.
            -->
            <div class="d-grid d-sm-flex gap-2 mt-3"
                 th:if="${reserva.estaActiva() and !reserva.esPasada()}">

                <a class="btn btn-principal"
                   th:href="@{/reservas/{codigo}/editar(codigo=${reserva.codigo}, email=${email})}">
                    Modificar reserva
                </a>

                <!--
                  La cancelacion viaja por POST porque cambia datos.
                  onsubmit pide confirmacion al usuario antes de enviar.
                -->
                <form th:action="@{/reservas/{codigo}/cancelar(codigo=${reserva.codigo})}" method="post"
                      onsubmit="return confirm('Esta seguro de cancelar la reserva?');">
                    <input type="hidden" name="email" th:value="${email}">
                    <button type="submit" class="btn btn-outline-danger w-100">Cancelar reserva</button>
                </form>
            </div>

            <p class="text-muted small mt-3" th:if="${reserva.esPasada()}">
                Esta reserva ya ocurrio, por lo que no admite cambios.
            </p>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
